<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="MacroLab.png">
<link rel="shortcut icon" href="MacroLab.ico">
<link rel="apple-touch-icon" href="MacroLab.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">  
<meta charset="UTF-8">
<title>MacroLab</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: #fff;
  padding: 20px;
}

h1 {
  color: #00ffae;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;     /* centre horizontal */
  justify-content: center; /* centre vertical */
  text-align: center;      /* centre le texte */
  margin-bottom: 20px;
}
  
.card {
  padding: 15px;
  border-radius: 16px;
  margin-bottom: 15px;
  background: #1c1c1c;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  
    display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
  .protein-card {
  border-left: 5px solid #00ffae;
}

.carbs-card {
  border-left: 5px solid #00bfff;
}

.fat-card {
  border-left: 5px solid #ffcc00;
}

.veggie-card {
  border-left: 5px solid #66ff66;
}

button {
  background: #2a2a2a;
  border: none;
  padding: 10px 14px;
  margin: 6px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  font-size: 30px;
}

button:hover {
  transform: scale(1.05);
  background: #00ffae;
  color: black;
}

.result {
  font-size: 24px;
  margin-top: 20px;
  color: #00ffae;
}

h1 {
  margin: 0;
  font-size: 28px;
  color: #00ffae;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: px;
  font-size: 18px;
  color: rgba(0, 255, 174, 0.5);
    box-shadow: 0 0 20px rgba(0, 255, 174, 0.5);
}

  .circle-container {
  position: relative;
  width: 200px;
  margin: 30px auto;
}

svg {
  transform: rotate(-90deg);
}

.circles {
  display: flex;
  gap: 30px;
  align-items: center;
}

.circle-container {
  margin: 0;
}

svg {
  transform: rotate(-90deg);
}

circle {
  fill: none;
  stroke-width: 10;
}

.bg {
  stroke: #2a2a2a;
}

.progress {
  stroke: #00ffae;
  stroke-dasharray: 502;
  stroke-dashoffset: 502;
  transition: 0.5s;
  filter: drop-shadow(0 0 6px #00ffae);
}

/* Couleur différente pour le poids */
.weight {
  stroke: #00bfff;
  filter: drop-shadow(0 0 6px #00bfff);
}

.circle-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.circle-text span {
  font-size: 28px;
  font-weight: bold;
}
  
  .macros {
  margin-top: 0px;
}

.bar {
  width: 100%;
  height: 12px;
  background: #2a2a2a;
  border-radius: 10px;
  margin-bottom: 15px;
}

.bar div {
  height: 100%;
  border-radius: 10px;
  transition: 0.4s;
}

#proteinBar { 
  background: #00ffae;
  width: 0%;
  }
#carbsBar { 
  background: #00bfff;
  width: 0%;
  }
#fatBar {
  background: #ffcc00;
  width: 0%;
}
  
  .top-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 80px;
}

.top-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 50px;
  flex-wrap: wrap;
}
  .side-logo {
  align-self: center;
  width: 130px;
  height: 130px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 255, 174, 0.5);
  margin-top: 25px;
}

  #foodList {
  list-style: none;
  padding: 0;
}

#foodList li {
  padding: 8px;
  border-bottom: 1px solid #333;
  font-size: 16px;
}
  .top-card {
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 25px;
  background: linear-gradient(145deg, #111, #1c1c1c);
  box-shadow: 0 0 25px rgba(0, 255, 174, 0.1);
}
  
  

</style>
</head>

<body>
  <div class="header">
    <img src="MacroLab.png" class="side-logo">
    <p class="subtitle">Fuel your performance</p>
  </div>
  
  <div class="card top-card">



  <div class="top-section">

    <div class="circles">

      <!-- CALORIES -->
      <div class="circle-container">
        <svg width="180" height="180">
          <circle cx="90" cy="90" r="80" class="bg"></circle>
          <circle cx="90" cy="90" r="80" class="progress" id="circleCal"></circle>
        </svg>
        <div class="circle-text">
          <span id="calories">0</span>
          <p>kcal</p>
        </div>
      </div>

      <!-- POIDS -->
      <div class="circle-container">
        <svg width="180" height="180">
          <circle cx="90" cy="90" r="80" class="bg"></circle>
          <circle cx="90" cy="90" r="80" class="progress weight" id="circleWeight"></circle>
        </svg>
        <div class="circle-text">
          <span id="weight">0</span>
          <p>g</p>
        </div>
      </div>

    </div>

    <div class="macros">

      <div>
        <p>💪 Protéines: <span id="protein">0</span>g</p>
        <div class="bar"><div id="proteinBar"></div></div>
      </div>

      <div>
        <p>🍚 Glucides: <span id="carbs">0</span>g</p>
        <div class="bar"><div id="carbsBar"></div></div>
      </div>

      <div>
        <p>🧈 Lipides: <span id="fat">0</span>g</p>
        <div class="bar"><div id="fatBar"></div></div>
      </div>

    </div>

  </div>

</div> 
 


  
<div class="card protein-card">
<h2>💪 Protéines</h2>
<button onclick="add(165,100,31,0,3,'🍗 Poulet (100g)')">🍗 Poulet (100g)</button>
<button onclick="add(250,100,26,0,20,'🐄 Steak (100g)')">🐄 Steak (100g)</button>
<button onclick="add(208,100,20,0,13,'🐟 Saumon (100g)')">🐟 Saumon (100g)</button>
<button onclick="add(120,100,26,0,1,'🐟 Thon (100g)')">🐟 Thon (100g)</button>
<button onclick="add(73,60,6,1,5,'🥚 1 Œuf')">🥚 1 Œuf</button>
<button onclick="add(80,100,8,4,3,'🥛 Fromage blanc (100g)')">🥛 Fromage blanc (100g)</button>
<button onclick="add(120,30,24,3,1,'🥤 Whey (30g)')">🥤 Whey</button>
</div>

<div class="card carbs-card">
<h2>🍚 Glucides</h2>
<button onclick="add(110,100,2,23,1,'🍚 Riz (100g)')">🍚 Riz (100g)</button>
<button onclick="add(130,100,5,25,1,'🍝 Pâtes (100g)')">🍝 Pâtes (100g)</button>
<button onclick="add(90,100,2,20,0,'🥔 Pomme de terre (100g)')">🥔 Pomme de terre (100g)</button>
<button onclick="add(90,110,1,23,0,'🍌 Banane')">🍌 Banane</button>
<button onclick="add(240,100,8,50,3,'🍞 Pain (100g)')">🍞 Pain (100g)</button>
<button onclick="add(68,20,0,17,0,'🍯 Miel (20g)')">🍯 Miel (20g)</button>
</div>

<div class="card fat-card">
<h2>🧈 Lipides</h2>
<button onclick="add(90,10,0,0,10,'🫒 Huile (10g)')">🫒 Huile (10g)</button>
<button onclick="add(183,30,6,6,15,'🌰 Amandes (30g)')">🌰 Amandes (30g)</button>
<button onclick="add(122,20,5,4,10,'🥜 Beurre de cacahuète (20g)')">🥜 Beurre de cacahuète (20g)</button>
<button onclick="add(246,150,3,12,22,'🥑 Avocat')">🥑 Avocat</button>
<button onclick="add(200,50,12,1,16,'🧀 Fromage (50g)')">🧀 Fromage (50g)</button>
</div>

<div class="card veggie-card">
<h2>🥦 Légumes</h2>
<button onclick="add(35,100,3,7,0,'🥦 Brocolis (100g)')">🥦 Brocolis (100g)</button>
<button onclick="add(20,100,1,4,0,'🥒 Courgettes (100g)')">🥒 Courgettes (100g)</button>
<button onclick="add(30,100,1,7,0,'🥕 Carottes (100g)')">🥕 Carottes (100g)</button>
<button onclick="add(30,100,2,6,0,'🥬 Haricots verts (100g)')">🥬 Haricots verts (100g)</button>
</div>
  
<div class="card">
<button onclick="reset()">🔄 Reset</button>
</div>

  <div class="card">
  <h2>📋 Aliments ajoutés</h2>
  <ul id="foodList"></ul>
</div>

<script>
let foodCounts = {};
let calories = 0;
let weight = 0;

let protein = 0;
let carbs = 0;
let fat = 0;

let maxCal = 3000;
let maxWeight = 2000;

function add(cal, g, p, c, f, name) {
  calories += cal;
  weight += g;

  protein += p;
  carbs += c;
  fat += f;

  if (foodCounts[name]) {
    foodCounts[name]++;
  } else {
    foodCounts[name] = 1;
  }

  renderList();
  update(); // ✅ AJOUT IMPORTANT
}

function renderList() {
  let list = document.getElementById("foodList");
  list.innerHTML = "";

  for (let food in foodCounts) {
    let li = document.createElement("li");
    li.textContent = food + " ×" + foodCounts[food];

    li.onclick = () => {
      foodCounts[food]--;

      // ⚠️ recalcul total complet
      recalcAll();

      if (foodCounts[food] <= 0) {
        delete foodCounts[food];
      }

      renderList();
    };

    list.appendChild(li);
  }
}
  
function reset() {
  calories = 0;
  weight = 0;
  protein = 0;
  carbs = 0;
  fat = 0;
  foodCounts = {};
  document.getElementById("foodList").innerHTML = "";

  update();
 }
  
  function recalcAll() {
  calories = 0;
  weight = 0;
  protein = 0;
  carbs = 0;
  fat = 0;

  for (let food in foodCounts) {
    let count = foodCounts[food];

    // retrouver le bouton correspondant
    document.querySelectorAll("button").forEach(btn => {
      if (btn.getAttribute("onclick")?.includes(food)) {
        let args = btn.getAttribute("onclick")
          .match(/add\((.*?)\)/)[1]
          .split(",");

        let cal = parseFloat(args[0]);
        let g = parseFloat(args[1]);
        let p = parseFloat(args[2]);
        let c = parseFloat(args[3]);
        let f = parseFloat(args[4]);

        calories += cal * count;
        weight += g * count;
        protein += p * count;
        carbs += c * count;
        fat += f * count;
      }
    });
  }

  update();
}

function update() {
  document.getElementById("calories").innerText = calories;
  document.getElementById("weight").innerText = weight;

  document.getElementById("protein").innerText = protein;
  document.getElementById("carbs").innerText = carbs;
  document.getElementById("fat").innerText = fat;

  let offsetCal = 502 - (502 * (calories / maxCal));
  let offsetWeight = 502 - (502 * (weight / maxWeight));

  document.getElementById("circleCal").style.strokeDashoffset = offsetCal;
  document.getElementById("circleWeight").style.strokeDashoffset = offsetWeight;

  document.getElementById("proteinBar").style.width = (protein / 180 * 100) + "%";
  document.getElementById("carbsBar").style.width = (carbs / 350 * 100) + "%";
  document.getElementById("fatBar").style.width = (fat / 90 * 100) + "%";
}
  
  
  
</script>

</body>
</html>
