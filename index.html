<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="MacroLab.png">
<link rel="shortcut icon" href="MacroLab.ico">
<link rel="apple-touch-icon" href="MacroLab.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">  
<meta charset="UTF-8">
<title>MacroLab</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: #fff;
  padding: 20px;
}

h1 {
  color: #00ffae;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #2a2a2a;
  border: none;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  font-size: 30px;
}

button:hover {
  background: #00ffae;
  color: black;
}

.result {
  font-size: 24px;
  margin-top: 20px;
  color: #00ffae;
}

h1 {
  margin: 0;
  font-size: 28px;
  color: #00ffae;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 5px;
  font-size: 14px;
  color: #aaa;
}

  .circle-container {
  position: relative;
  width: 200px;
  margin: 30px auto;
}

svg {
  transform: rotate(-90deg);
}

.circles {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 30px;
}

.circle-container {
  position: relative;
  width: 180px;
}

svg {
  transform: rotate(-90deg);
}

circle {
  fill: none;
  stroke-width: 10;
}

.bg {
  stroke: #2a2a2a;
}

.progress {
  stroke: #00ffae;
  stroke-dasharray: 502;
  stroke-dashoffset: 502;
  transition: 0.5s;
  filter: drop-shadow(0 0 6px #00ffae);
}

/* Couleur différente pour le poids */
.weight {
  stroke: #00bfff;
  filter: drop-shadow(0 0 6px #00bfff);
}

.circle-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.circle-text span {
  font-size: 28px;
  font-weight: bold;
}
  
  .macros {
  margin-top: 30px;
}

.bar {
  width: 100%;
  height: 12px;
  background: #2a2a2a;
  border-radius: 10px;
  margin-bottom: 15px;
}

.bar div {
  height: 100%;
  border-radius: 10px;
  transition: 0.4s;
}

#proteinBar { background: #00ffae; }
#carbsBar { background: #00bfff; }
#fatBar { background: #ffcc00; }
  
  .top-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
}

.side-logo {
  width: 100px;
  height: 100px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 255, 174, 0.5);
}

@media (max-width: 600px) {
  .top-section {
    flex-direction: column;
  }

  .side-logo {
    width: 70px;
    height: 70px;
  }
}

</style>
</head>

<body>

<div class="top-section">

  <img src="MacroLab.png" class="side-logo">

  <div class="circles">

  <!-- CALORIES -->
  <div class="circle-container">
    <svg width="180" height="180">
      <circle cx="90" cy="90" r="80" class="bg"></circle>
      <circle cx="90" cy="90" r="80" class="progress" id="circleCal"></circle>
    </svg>
    <div class="circle-text">
      <span id="calories">0</span>
      <p>kcal</p>
    </div>
  </div>

  <!-- POIDS -->
  <div class="circle-container">
    <svg width="180" height="180">
      <circle cx="90" cy="90" r="80" class="bg"></circle>
      <circle cx="90" cy="90" r="80" class="progress weight" id="circleWeight"></circle>
    </svg>
    <div class="circle-text">
      <span id="weight">0</span>
      <p>g</p>
    </div>
  </div>

</div> <!-- fin circles -->
</div> <!-- fin top-section -->
  
 

<div class="macros">

  <div>
    <p>💪 Protéines: <span id="protein">0</span>g</p>
    <div class="bar"><div id="proteinBar"></div></div>
  </div>

  <div>
    <p>🍚 Glucides: <span id="carbs">0</span>g</p>
    <div class="bar"><div id="carbsBar"></div></div>
  </div>

  <div>
    <p>🧈 Lipides: <span id="fat">0</span>g</p>
    <div class="bar"><div id="fatBar"></div></div>
  </div>

</div>
  
<div class="card">
<h2>💪 Protéines</h2>
  <button onclick="add(165,100,31,0,3)">🍗 Poulet (100g)</button>
  <button onclick="add(250,100,26,0,20)">🐄 Steak (100g)</button>
  <button onclick="add(208,100,20,0,13)">🐟 Saumon (100g)</button>
  <button onclick="add(120,100,26,0,1)">🐟 Thon (100g)</button>
  <button onclick="add(73,60,6,1,5)">🥚 1 Œuf</button>
  <button onclick="add(80,100,8,4,3)">🥛 Fromage blanc (100g)</button>
  <button onclick="add(120,30,24,3,1)">🥤 Whey</button>
</div>

<div class="card">
<h2>🍚 Glucides</h2>
  <button onclick="add(110,100,2,23,1)">🍚 Riz (100g)</button>
  <button onclick="add(130,100,5,25,1)">🍝 Pâtes (100g)</button>
  <button onclick="add(90,100,2,20,0)">🥔 Pomme de terre (100g)</button>
  <button onclick="add(90,110,1,23,0)">🍌 Banane</button>
  <button onclick="add(240,100,8,50,3)">🍞 Pain (100g)</button>
  <button onclick="add(68,20,0,17,0)">🍯 Miel (20g)</button>
</div>

<div class="card">
<h2>🧈 Lipides</h2>
  <button onclick="add(90,10,0,0,10)">🫒 Huile (10g)</button>
  <button onclick="add(183,30,6,6,15)">🌰 Amandes (30g)</button>
  <button onclick="add(122,20,5,4,10)">🥜 Beurre de cacahuète (20g)</button>
  <button onclick="add(246,150,3,12,22)">🥑 Avocat</button>
  <button onclick="add(200,50,12,1,16)">🧀 Fromage (50g)</button>
</div>

  <!-- LEGUMES -->
<h2>🥦 Légumes</h2>
<div class="card">
  <button onclick="add(35,100,3,7,0)">🥦 Brocolis (100g)</button>
  <button onclick="add(20,100,1,4,0)">🥒 Courgettes (100g)</button>
  <button onclick="add(30,100,1,7,0)">🥕 Carottes (100g)</button>
  <button onclick="add(30,100,2,6,0)">🥬 Haricots verts (100g)</button>
</div>
  
<div class="card">
<button onclick="reset()">🔄 Reset</button>
</div>


<script>
let calories = 0;
let weight = 0;

let protein = 0;
let carbs = 0;
let fat = 0;

let maxCal = 3000;
let maxWeight = 2000;

function add(cal, g, p, c, f) {
  calories += cal;
  weight += g;

  protein += p;
  carbs += c;
  fat += f;

  update();
}

function reset() {
  calories = 0;
  weight = 0;
  protein = 0;
  carbs = 0;
  fat = 0;
  update();
}

function update() {
  document.getElementById("calories").innerText = calories;
  document.getElementById("weight").innerText = weight;

  document.getElementById("protein").innerText = protein;
  document.getElementById("carbs").innerText = carbs;
  document.getElementById("fat").innerText = fat;

  let offsetCal = 502 - (502 * (calories / maxCal));
  let offsetWeight = 502 - (502 * (weight / maxWeight));

  document.getElementById("circleCal").style.strokeDashoffset = offsetCal;
  document.getElementById("circleWeight").style.strokeDashoffset = offsetWeight;

  document.getElementById("proteinBar").style.width = (protein / 180 * 100) + "%";
  document.getElementById("carbsBar").style.width = (carbs / 350 * 100) + "%";
  document.getElementById("fatBar").style.width = (fat / 90 * 100) + "%";
}
</script>

</body>
</html>
