<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="MacroLab.png">
<link rel="shortcut icon" href="MacroLab.ico">
<link rel="apple-touch-icon" href="MacroLab.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">  
<meta charset="UTF-8">
<title>MacroLab</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: #fff;
  padding: 20px;
}

h1 {
  color: #00ffae;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #2a2a2a;
  border: none;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  font-size: 18px;
}

button:hover {
  background: #00ffae;
  color: black;
}

.result {
  font-size: 24px;
  margin-top: 20px;
  color: #00ffae;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px;
  margin-bottom: 20px;
  background: linear-gradient(145deg, #111, #1c1c1c);
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 255, 174, 0.15);
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  margin-bottom: 10px;
  box-shadow: 0 0 15px rgba(0, 255, 174, 0.5);
  transition: 0.3s;
}

.logo:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(0, 255, 174, 0.9);
}

h1 {
  margin: 0;
  font-size: 28px;
  color: #00ffae;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 5px;
  font-size: 14px;
  color: #aaa;
}

</style>
</head>

<body>

<div class="header">
  <img src="MacroLab.png" alt="logo" class="logo">
  <h1>MacroLab</h1>
  <p class="subtitle">Fuel your performance</p>
</div>

<div class="card">
<h2>💪 Protéines</h2>
  <button onclick="add(165)">🍗 Poulet (100g)</button>
  <button onclick="add(250)">🐄 Steak (100g)</button>
  <button onclick="add(208)">🐟 Saumon (100g)</button>
  <button onclick="add(120)">🐟 Thon (100g)</button>
  <button onclick="add(70)">🥚 Œuf</button>
  <button onclick="add(80)">🥛 Fromage blanc (100g)</button>
  <button onclick="add(120)">🥤 Whey</button>
</div>

<div class="card">
<h2>🍚 Glucides</h2>
  <button onclick="add(110)">🍚 Riz (100g)</button>
  <button onclick="add(130)">🍝 Pâtes (100g)</button>
  <button onclick="add(90)">🥔 Pomme de terre (100g)</button>
  <button onclick="add(90)">🍌 Banane</button>
  <button onclick="add(240)">🍞 Pain (100g)</button>
  <button onclick="add(300)">🍯 Miel (100g)</button>
</div>

<div class="card">
<h2>🧈 Lipides</h2>
  <button onclick="add(90)">🫒 Huile (10g)</button>
  <button onclick="add(580)">🌰 Amandes (100g)</button>
  <button onclick="add(590)">🥜 Beurre de cacahuète (100g)</button>
  <button onclick="add(400)">🥑 Avocat</button>
  <button onclick="add(400)">🧀 Fromage</button>
</div>

  <!-- LEGUMES -->
<h2>🥦 Légumes</h2>
<div class="card">
  <button onclick="add(35)">🥦 Brocolis (100g)</button>
  <button onclick="add(20)">🥒 Courgettes (100g)</button>
  <button onclick="add(30)">🥕 Carottes (100g)</button>
  <button onclick="add(30)">🥬 Haricots verts (100g)</button>
</div>
  
<div class="card">
<button onclick="reset()">🔄 Reset</button>
</div>

<div class="result">
🔥 Total : <span id="total">0</span> kcal
</div>

<script>
let total = 0;

function add(cal) {
  total += cal;
  document.getElementById("total").innerText = total;
}

function reset() {
  total = 0;
  document.getElementById("total").innerText = 0;
}
</script>

</body>
</html>
