<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="MacroLab.png">
<link rel="shortcut icon" href="MacroLab.ico">
<link rel="apple-touch-icon" href="MacroLab.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">  
<meta charset="UTF-8">
<title>MacroLab</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: #fff;
  padding: 20px;
}

h1 {
  color: #00ffae;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

button {
  background: #2a2a2a;
  border: none;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  font-size: 18px;
}

button:hover {
  background: #00ffae;
  color: black;
}

.result {
  font-size: 24px;
  margin-top: 20px;
  color: #00ffae;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px;
  margin-bottom: 20px;
  background: linear-gradient(145deg, #111, #1c1c1c);
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 255, 174, 0.15);
}

.logo {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  margin-bottom: 10px;
  box-shadow: 0 0 15px rgba(0, 255, 174, 0.5);
  transition: 0.3s;
}

.logo:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(0, 255, 174, 0.9);
}

h1 {
  margin: 0;
  font-size: 28px;
  color: #00ffae;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 5px;
  font-size: 14px;
  color: #aaa;
}

  .circle-container {
  position: relative;
  width: 200px;
  margin: 30px auto;
}

svg {
  transform: rotate(-90deg);
}

.circles {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 30px;
}

.circle-container {
  position: relative;
  width: 180px;
}

svg {
  transform: rotate(-90deg);
}

circle {
  fill: none;
  stroke-width: 10;
}

.bg {
  stroke: #2a2a2a;
}

.progress {
  stroke: #00ffae;
  stroke-dasharray: 502;
  stroke-dashoffset: 502;
  transition: 0.5s;
  filter: drop-shadow(0 0 6px #00ffae);
}

/* Couleur différente pour le poids */
.weight {
  stroke: #00bfff;
  filter: drop-shadow(0 0 6px #00bfff);
}

.circle-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.circle-text span {
  font-size: 28px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="header">
  <img src="MacroLab.png" alt="logo" class="logo">
  <p class="subtitle">Fuel your performance</p>
</div>

<div class="circles">

  <!-- CALORIES -->
  <div class="circle-container">
    <svg width="180" height="180">
      <circle cx="90" cy="90" r="80" class="bg"></circle>
      <circle cx="90" cy="90" r="80" class="progress" id="circleCal"></circle>
    </svg>
    <div class="circle-text">
      <span id="calories">0</span>
      <p>kcal</p>
    </div>
  </div>

  <!-- POIDS -->
  <div class="circle-container">
    <svg width="180" height="180">
      <circle cx="90" cy="90" r="80" class="bg"></circle>
      <circle cx="90" cy="90" r="80" class="progress weight" id="circleWeight"></circle>
    </svg>
    <div class="circle-text">
      <span id="weight">0</span>
      <p>g</p>
    </div>
  </div>

</div>
  
<div class="card">
<h2>💪 Protéines</h2>
  <button onclick="add(165,100)">🍗 Poulet (100g)</button>
  <button onclick="add(250,100)">🐄 Steak (100g)</button>
  <button onclick="add(208,100)">🐟 Saumon (100g)</button>
  <button onclick="add(120,100)">🐟 Thon (100g)</button>
  <button onclick="add(73,60)">🥚 1 Œuf</button>
  <button onclick="add(80,100)">🥛 Fromage blanc (100g)</button>
  <button onclick="add(120,30)">🥤 Whey</button>
</div>

<div class="card">
<h2>🍚 Glucides</h2>
  <button onclick="add(110,100)">🍚 Riz (100g)</button>
  <button onclick="add(130,100)">🍝 Pâtes (100g)</button>
  <button onclick="add(90,100)">🥔 Pomme de terre (100g)</button>
  <button onclick="add(90,110)">🍌 Banane</button>
  <button onclick="add(240,100)">🍞 Pain (100g)</button>
  <button onclick="add(68,20)">🍯 Miel (20g)</button>
</div>

<div class="card">
<h2>🧈 Lipides</h2>
  <button onclick="add(90,10)">🫒 Huile (10g)</button>
  <button onclick="add(183,30)">🌰 Amandes (30g)</button>
  <button onclick="add(122,20)">🥜 Beurre de cacahuète (20g)</button>
  <button onclick="add(246,150)">🥑 Avocat</button>
  <button onclick="add(200,50)">🧀 Fromage (50g)</button>
</div>

  <!-- LEGUMES -->
<h2>🥦 Légumes</h2>
<div class="card">
  <button onclick="add(35,100)">🥦 Brocolis (100g)</button>
  <button onclick="add(20,100)">🥒 Courgettes (100g)</button>
  <button onclick="add(30,100)">🥕 Carottes (100g)</button>
  <button onclick="add(30,100)">🥬 Haricots verts (100g)</button>
</div>
  
<div class="card">
<button onclick="reset()">🔄 Reset</button>
</div>

<div class="result">
🔥 Total : <span id="total">0</span> kcal
</div>

<script>
let calories = 0;
let weight = 0;

let maxCal = 3000;
let maxWeight = 2000; // objectif poids (g)

function add(cal, g) {
  calories += cal;
  weight += g;
  update();
}

function reset() {
  calories = 0;
  weight = 0;
  update();
}

function update() {
  document.getElementById("calories").innerText = calories;
  document.getElementById("weight").innerText = weight;

  let offsetCal = 502 - (502 * (calories / maxCal));
  let offsetWeight = 502 - (502 * (weight / maxWeight));

  document.getElementById("circleCal").style.strokeDashoffset = offsetCal;
  document.getElementById("circleWeight").style.strokeDashoffset = offsetWeight;
}
</script>

</body>
</html>
